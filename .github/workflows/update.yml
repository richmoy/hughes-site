name: Update Hughes status

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check feeds and update status.json
        run: node scripts/update.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain status.json index.html)" ]; then
            git config user.name "hughes-status-bot"
            git config user.email "actions@users.noreply.github.com"
            git add status.json index.html
            git commit -m "Update status"
            git push
          fi
